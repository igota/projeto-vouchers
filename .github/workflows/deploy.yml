name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/vouchers/app
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart containers
        run: |
          cd /home/vouchers/app/vouchers
          docker compose up -d --build
