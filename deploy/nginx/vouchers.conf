# Copiado para /etc/nginx/conf.d/default.conf dentro da imagem do frontend
# (ver frontend/Dockerfile) — não precisa instalar manualmente. `api` abaixo é
# o nome do serviço no docker-compose.yml, resolvido pela rede interna do Compose.
#
# Se um dia rodar sem Docker (Nginx direto no host): trocar `proxy_pass` para
# http://127.0.0.1:8000 e `root` para o caminho onde `frontend/dist` foi copiado.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota não-arquivo cai no index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Só as sub-rotas reais do Flask (backend/gerencia.py) — NÃO o prefixo
    # /gerencia/ inteiro, que também é usado pelas telas do React
    # (/gerencia = login, /gerencia/dashboard = painel, ver frontend/src/App.tsx).
    # Um location /gerencia/ genérico aqui sequestraria essas rotas de tela.
    location ~ ^/gerencia/(login|logout|api/) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
